name: Deploy UOS Virtual Tour to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check generated asset manifest
        run: node scripts/build-tour-manifest.cjs --check
      - name: Check browser module syntax
        shell: bash
        run: |
          set -euo pipefail
          ROOT="M7A_GitHub_Website_Full_Resolution/m7a-building"
          for file in tour.js tour-renderer.js tour-routes.js routes/m7a.js routes/theater.js routes/library.js routes/mens-hall.js; do
            node --input-type=module --check < "$ROOT/$file"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload UOS tour
        uses: actions/upload-pages-artifact@v3
        with:
          path: M7A_GitHub_Website_Full_Resolution/m7a-building
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
