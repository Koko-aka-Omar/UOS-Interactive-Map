name: UOS Tour QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tour graph and assets
        run: node tests/validate-tour.cjs
      - name: Build navigation QA page
        run: node tests/build-navigation-qa.cjs
